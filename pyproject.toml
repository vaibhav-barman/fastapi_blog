[project]
name = "fastapi-blog"
version = "0.1.0"
description = "A blog application built with FastAPI"
readme = "README.md"
authors = [
    { name = "Vaibhav", email = "vaibhavbarman2609@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.156.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
vaibhav-blog = "vaibhav_blog:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
